version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/apps/web", "/apps/api"]
    schedule:
      interval: weekly
