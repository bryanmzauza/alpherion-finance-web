name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lê packageManager do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          APP_ENV: prod
          DATABASE_URL: postgres://ci
          API_SERVICE_TOKEN_WEB: ci-placeholder-token-00000000000000000000

  lighthouse:
    name: web (Lighthouse ≥ 95, orçamento de JS)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
        env:
          APP_ENV: prod
          SITE_URL: http://localhost:3000
          DATABASE_URL: postgres://ci
          API_SERVICE_TOKEN_WEB: ci-placeholder-token-00000000000000000000
      # apps/web/lighthouserc.json: sobe `pnpm start`, 3 rodadas em /, /raio-x, /acoes e /mercado, mediana ≥ 0,95
      # (performance só avisa: runner é ruidoso) e scripts ≤ 170 kB gzip (site.md §9).
      - run: pnpm --filter web lighthouse
        env:
          APP_ENV: prod
          SITE_URL: http://localhost:3000
          DATABASE_URL: postgres://ci
          API_SERVICE_TOKEN_WEB: ci-placeholder-token-00000000000000000000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/reports
          retention-days: 14

  e2e:
    name: web (zero cookie e busca, Playwright)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web build
        env:
          APP_ENV: prod
          SITE_URL: http://127.0.0.1:3100
          DATABASE_URL: postgres://ci
          API_SERVICE_TOKEN_WEB: ci-placeholder-token-00000000000000000000
      # Sem API no CI: as páginas saem com "—" e a busca com o aviso de indisponível —
      # exatamente o caso em que um cookie "de fallback" poderia escapar.
      - run: pnpm --filter web e2e
        env:
          CI: "true"
          APP_ENV: prod
          SITE_URL: http://127.0.0.1:3100
          DATABASE_URL: postgres://ci
          API_SERVICE_TOKEN_WEB: ci-placeholder-token-00000000000000000000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  audit:
    name: audit (pnpm audit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run pip-audit
        working-directory: apps/api
