name: Deploy

# Deploy só por tag (site.md §10). `web` e `api` compartilham a mesma tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente para (re)implantar"
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # O CI completo roda no push da branch; aqui repetimos o essencial para que uma tag
  # criada fora da main nunca vá para produção sem lint/typecheck/teste verdes.
  verificar:
    name: verificações
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run mypy .
        working-directory: apps/api
      - run: uv run pytest
        working-directory: apps/api

  imagens:
    name: build e push (${{ matrix.nome }})
    needs: verificar
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nome: web
            contexto: .
            dockerfile: apps/web/Dockerfile
          - nome: api
            contexto: apps/api
            dockerfile: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/alpherion-${{ matrix.nome }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SITE_URL entra no build: canônicas, OG e sitemap são resolvidos contra ela.
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://alpherion.com.br' }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
          provenance: false

  vps:
    name: deploy na VPS
    needs: imagens
    runs-on: ubuntu-latest
    environment: production # exige aprovação manual se configurado no repositório
    steps:
      - name: SSH → infra/scripts/deploy.sh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/alpherion
            git fetch --tags --quiet
            infra/scripts/deploy.sh "${{ github.event.inputs.tag || github.ref_name }}"
