# Produção (site.md §3.1, §7.6). Roda na VPS, em /opt/alpherion, com o .env ao lado (600).
#
#   docker compose -f infra/compose.yml --env-file .env up -d
#
# Só o nginx publica portas. Três redes:
#   edge     — nginx ↔ serviços HTTP (única com porta publicada)
#   internal — serviços ↔ postgres/redis, SEM saída para a internet
#   egress   — saída para as fontes externas (CVM, B3, Tesouro, BCB, CoinGecko, Claude, SMTP)
# postgres e redis ficam só em `internal`: não recebem da borda nem saem para a internet.
# As imagens de web e api vêm do GHCR, com a tag do release (deploy.sh exporta IMAGE_TAG).

name: alpherion

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  nginx:
    <<: [*restart, *logging]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./nginx/cloudflare:/etc/nginx/cloudflare:ro # gerado por update-cloudflare-ips.sh
      - ${CLOUDFLARE_ORIGIN_CERT_PATH:?}:/etc/nginx/tls/origin.pem:ro
      - ${CLOUDFLARE_ORIGIN_KEY_PATH:?}:/etc/nginx/tls/origin.key:ro
      - ./nginx/tls/cloudflare-origin-pull-ca.pem:/etc/nginx/tls/origin-pull-ca.pem:ro
      - nginx-cache:/var/cache/nginx
      # Registro de acesso do Marco Civil art. 15: precisa sobreviver ao container
      # (logrotate do host guarda 180 dias — bootstrap-vps.sh).
      - nginx-logs:/var/log/nginx
    networks: [edge]
    depends_on: [web, api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: [*restart, *logging]
    image: ghcr.io/${GHCR_OWNER:?}/alpherion-web:${IMAGE_TAG:?}
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks: [edge, internal, egress] # egress: SMTP transacional e Listmonk externo
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    <<: [*restart, *logging]
    image: ghcr.io/${GHCR_OWNER:?}/alpherion-api:${IMAGE_TAG:?}
    env_file: ../.env
    networks: [edge, internal, egress] # egress: Claude API
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Mesma imagem da API, sem rota HTTP e sem rede `edge`: só jobs agendados (site.md §3.5).
  # O agendamento é o cron do host chamando `docker compose exec data python -m alpherion.data.jobs.X`
  # (preferido no §3.3 do plano); este container mantém o ambiente pronto e o lock no Redis.
  data:
    <<: [*restart, *logging]
    image: ghcr.io/${GHCR_OWNER:?}/alpherion-api:${IMAGE_TAG:?}
    command: ["python", "-m", "alpherion.data.scheduler"]
    env_file: ../.env
    networks: [internal, egress] # sem `edge`: o worker não recebe requisição
    volumes:
      - data-tmp:/tmp/alpherion # DATA_DOWNLOAD_DIR, com limite de tamanho
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    env_file: ../.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-alpherion}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - log_min_duration_statement=2000
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Volume separado para o schema `market` (§7.6: dezenas de GB) — tablespace criada
      # por bootstrap-vps.sh e usada nas migrations do Alembic.
      - ${MARKET_TABLESPACE_PATH:-/srv/alpherion/market}:/var/lib/postgresql/market
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/init.sql:/opt/alpherion/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-alpherion}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  listmonk:
    <<: [*restart, *logging]
    image: listmonk/listmonk:v5.0.3
    command: ["sh", "-c", "./listmonk --install --idempotent --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_app__root_url: "https://news.${ROOT_DOMAIN:?}"
      LISTMONK_db__host: postgres
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:?}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:?}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:?}
    volumes:
      - listmonk-uploads:/listmonk/uploads
    networks: [edge, internal, egress] # egress: envio por SMTP
    depends_on:
      postgres: { condition: service_healthy }

  umami:
    <<: [*restart, *logging]
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      DISABLE_TELEMETRY: "1"
      TRACKER_SCRIPT_NAME: script # /script.js
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }

  # Monitoramento externo do próprio site (§7.6). Sem rede `internal`: só bate nas URLs públicas.
  uptime-kuma:
    <<: [*restart, *logging]
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma-data:/app/data
    networks: [edge]

networks:
  edge:
  internal:
    internal: true # sem rota para fora: só serviço ↔ postgres/redis
  egress:

volumes:
  postgres-data:
  redis-data:
  listmonk-uploads:
  uptime-kuma-data:
  nginx-cache:
  nginx-logs:
  data-tmp:
