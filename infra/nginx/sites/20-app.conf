# app.alpherion.com.br — app autenticado (mesma imagem do web; o route group (app) responde
# por este host). Nada aqui é cacheado: toda resposta é de um usuário logado.

server {
    listen 443 ssl;
    http2 on;
    server_name app.alpherion.com.br;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn perip 20;

    proxy_cache off;
    proxy_buffering off;

    # Login e magic link.
    location ~ ^/api/auth/ {
        limit_req zone=sensitive burst=10 nodelay;
        proxy_pass http://$up_web$request_uri;
    }

    # Importação de arquivos da B3 e CSV: corpo maior e resposta demorada (parse na API).
    location ~ ^/api/(imports|analyses) {
        limit_req zone=sensitive burst=5 nodelay;
        client_max_body_size 5m;
        proxy_read_timeout 120s;
        proxy_pass http://$up_web$request_uri;
    }

    location /_next/static/ {
        proxy_pass http://$up_web$request_uri;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://$up_web$request_uri;
    }
}
