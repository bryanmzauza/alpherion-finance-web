# Serviços de apoio: stats (Umami), news (Listmonk) e status (Uptime Kuma).
#
# Os painéis administrativos destes três devem ficar atrás do **Cloudflare Access**
# (Zero Trust → Application, política por e-mail do Bryan). O nginx aqui só encaminha;
# a autenticação forte é da borda. Enquanto o Access não estiver configurado, use o
# bloco `allow`/`deny` comentado em cada painel com o seu IP fixo.

# stats.alpherion.com.br — Umami. O script e o /api/send precisam ser públicos
# (é o que o navegador do visitante chama); o resto é painel.
server {
    listen 443 ssl;
    http2 on;
    server_name stats.alpherion.com.br;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_conn perip 20;

    location = /script.js {
        proxy_pass http://$up_umami$request_uri;
        proxy_cache market;
        proxy_cache_valid 200 6h;
        add_header Cache-Control "public, max-age=21600" always;
    }

    location = /api/send {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://$up_umami$request_uri;
    }

    location / {
        # allow SEU.IP.FIXO.AQUI; deny all;   # enquanto o Cloudflare Access não estiver ativo
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://$up_umami$request_uri;
    }
}

# news.alpherion.com.br — Listmonk. Público: links de campanha, descadastro one-click
# (List-Unsubscribe) e rastreamento de link. Privado: /admin e /api.
server {
    listen 443 ssl;
    http2 on;
    server_name news.alpherion.com.br;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_conn perip 20;

    location ~ ^/(subscription|link|campaign|uploads|public)/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://$up_listmonk$request_uri;
    }

    location = /health {
        access_log off;
        proxy_pass http://$up_listmonk$request_uri;
    }

    # API do Listmonk: quem chama é o `web`, pela rede interna (LISTMONK_URL=http://listmonk:9000).
    # Pela borda, ninguém precisa.
    location /api/ {
        deny all;
    }

    location / {
        # allow SEU.IP.FIXO.AQUI; deny all;   # enquanto o Cloudflare Access não estiver ativo
        limit_req zone=sensitive burst=10 nodelay;
        proxy_pass http://$up_listmonk$request_uri;
    }
}

# status.alpherion.com.br — Uptime Kuma. A página de status pode ser pública
# (/status/<slug>); o painel, não.
server {
    listen 443 ssl;
    http2 on;
    server_name status.alpherion.com.br;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_conn perip 10;

    location ~ ^/(status|assets|icon|upload|api/(status-page|badge))/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://$up_kuma$request_uri;
    }

    location /socket.io/ {
        proxy_pass http://$up_kuma$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    location / {
        # allow SEU.IP.FIXO.AQUI; deny all;   # enquanto o Cloudflare Access não estiver ativo
        limit_req zone=sensitive burst=10 nodelay;
        proxy_pass http://$up_kuma$request_uri;
    }
}
