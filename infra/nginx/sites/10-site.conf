# alpherion.com.br — site público (landing, conteúdo, portal de mercado).
# SSG/ISR no Next; zero cookie (site.md §8.5).

server {
    listen 443 ssl;
    http2 on;
    server_name www.alpherion.com.br;
    include /etc/nginx/snippets/tls.conf;
    return 301 https://alpherion.com.br$request_uri; # §2.1: www → apex
}

server {
    listen 443 ssl;
    http2 on;
    server_name alpherion.com.br;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn perip 40;

    # Inscrição na lista: o limite real é o do app (Redis, 10/min/IP) e o da Cloudflare;
    # este é o freio da origem.
    location = /api/subscribe {
        limit_req zone=sensitive burst=5 nodelay;
        proxy_pass http://$up_web$request_uri;
    }

    # Revalidação do ISR, chamada pelo job `revalidate_pages` com token (Etapa 3).
    # Só da rede interna: a Cloudflare nunca precisa encaminhar isto.
    location = /api/revalidate {
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://$up_web$request_uri;
    }

    # Páginas de mercado: cacheáveis na borda (§7.2). Entram na Etapa 3; a regra já fica
    # pronta porque o `Cache-Control` vem do Next e o cache aqui é só a segunda camada.
    location ~ ^/(acoes|fiis|etfs|bdrs|indices|tesouro|cripto|setores|mercado|agenda)(/|$) {
        include /etc/nginx/snippets/cache-market.conf;
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://$up_web$request_uri;
    }

    # Estáticos com hash no nome: imutáveis.
    location /_next/static/ {
        proxy_pass http://$up_web$request_uri;
        proxy_cache market;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://$up_web$request_uri;
    }
}
