# api.alpherion.com.br — API única (site.md §2.3). Uso interno (web chama pela rede
# `edge`, sem passar por aqui) e, no futuro, o bot do Telegram. Auth por token de serviço.

server {
    listen 443 ssl;
    http2 on;
    server_name api.alpherion.com.br;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn perip 10;

    # Sem indexação: a API não é conteúdo.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # §2.3: `/v1/health` é exceção de auth e por isso só pode ser interno.
    location = /v1/health {
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://$up_api$request_uri;
    }

    # Endpoints que gastam LLM ou CPU: freio próprio na origem, além do rate limit da API.
    location ~ ^/v1/(analyses|imports|portfolios) {
        limit_req zone=sensitive burst=5 nodelay;
        client_max_body_size 5m;
        proxy_read_timeout 120s;
        proxy_pass http://$up_api$request_uri;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://$up_api$request_uri;
    }
}
