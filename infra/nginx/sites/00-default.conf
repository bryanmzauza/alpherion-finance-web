# Servidor padrão: fecha a porta para quem chega por IP ou com Host desconhecido
# (varredura). `444` fecha a conexão sem resposta.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/tls.conf;

    # Healthcheck do container (docker healthcheck bate em 127.0.0.1/healthz, sem TLS).
    location = /healthz {
        access_log off;
        allow 127.0.0.0/8;
        deny all;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

# Todo tráfego HTTP vira HTTPS. A Cloudflare já entrega em HTTPS quando o proxy está
# ligado; isto cobre acesso direto (que o ufw bloqueia) e o período de configuração.
server {
    listen 80;
    server_name alpherion.com.br www.alpherion.com.br app.alpherion.com.br
                api.alpherion.com.br stats.alpherion.com.br news.alpherion.com.br
                status.alpherion.com.br;
    return 301 https://$host$request_uri;
}
