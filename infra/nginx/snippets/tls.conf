# TLS de origem: certificado da Cloudflare (Full strict) + Authenticated Origin Pulls,
# que recusa qualquer conexão que não venha da Cloudflare (site.md §7.2).
ssl_certificate     /etc/nginx/tls/origin.pem;
ssl_certificate_key /etc/nginx/tls/origin.key;

ssl_client_certificate /etc/nginx/tls/origin-pull-ca.pem;
ssl_verify_client on;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
