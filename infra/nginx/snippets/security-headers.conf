# site.md §7.3 — revisado em 21/09/2026 (Etapa 2.4):
# o Next já envia CSP, X-Content-Type-Options, Referrer-Policy, Permissions-Policy,
# COOP e X-Frame-Options (apps/web/next.config.ts → headers()).
# Repetir CSP aqui faria o navegador aplicar a INTERSEÇÃO das duas e quebrar o site.
# Por isso o nginx acrescenta apenas o HSTS, que depende do TLS e o Next não deve mandar.
#
# `always`: vale também em respostas de erro (4xx/5xx).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
