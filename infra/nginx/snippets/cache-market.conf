# Cache de borda das páginas de ativo (site.md §7.2, §9).
# O ISR do Next já devolve `Cache-Control: public, s-maxage=3600, stale-while-revalidate=86400`;
# aqui guardamos a resposta também no nginx, para o caso de miss/purge na Cloudflare.
proxy_cache market;
proxy_cache_valid 200 301 1h;
proxy_cache_valid 404 1m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_revalidate on;
# Nunca cachear resposta de requisição com cookie de sessão (o site público não tem cookie,
# mas isso evita servir conteúdo de um visitante para outro se algo mudar).
proxy_no_cache $http_cookie;
proxy_cache_bypass $http_cookie;
add_header X-Cache-Status $upstream_cache_status always;
