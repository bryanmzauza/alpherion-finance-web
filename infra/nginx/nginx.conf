# nginx da VPS (site.md §7.2). Recebe só da Cloudflare (ufw), TLS de origem com
# Authenticated Origin Pulls, e faz proxy para web/api/umami/listmonk/uptime-kuma.
# Os headers de segurança (exceto HSTS) vêm do Next (§7.3) — aqui não se repete CSP.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # IP real do visitante (para log, rate limit e o `x-forwarded-for` que o app lê).
    include /etc/nginx/cloudflare/real-ip.conf;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                    'cache=$upstream_cache_status';
    # Registro de acesso do Marco Civil art. 15 (6 meses) — a rotação está no logrotate do host.
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 5m; # arquivos da Área do Investidor (§7.2)
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    resolver 127.0.0.11 valid=30s; # DNS do Docker
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml application/manifest+json;

    # Rate limit de segurança da origem. O limite "de produto" é o da Cloudflare (§7.2)
    # e o do app (Redis); este aqui existe para o caso de alguém passar pela borda.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sensitive:10m rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # Cache de borda das páginas de ativo (§7.2). A Cloudflare é a primeira camada;
    # esta é a segunda, para o caso de purge/miss.
    proxy_cache_path /var/cache/nginx/market levels=1:2 keys_zone=market:50m
                     max_size=1g inactive=24h use_temp_path=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Upstreams como VARIÁVEL, não como bloco `upstream`: com bloco, o nginx resolve os
    # nomes no boot e **não sobe** se um serviço estiver fora — um deploy ruim do `web`
    # derrubaria também status, stats e news. Com variável, a resolução é por requisição,
    # pelo DNS do Docker (`resolver` acima, cache de 30 s), e cada host cai sozinho.
    map $host $up_web      { default "web:3000"; }
    map $host $up_api      { default "api:8000"; }
    map $host $up_umami    { default "umami:3000"; }
    map $host $up_listmonk { default "listmonk:9000"; }
    map $host $up_kuma     { default "uptime-kuma:3001"; }

    include /etc/nginx/conf.d/*.conf;
}
